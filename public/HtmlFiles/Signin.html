<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick C</title>
    <link rel="stylesheet" href="../CssFiles/Signin.css">
</head>

<body>
    <section>
        <img src="../Pictures/bg.webp" alt="Logo" class="logo">
        <div class="login-box">
            <form id="signupForm">
                <h2>Sign Up</h2>
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                    <input type="email" id="email" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input type="password" id="password" required>
                    <label>Password</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input type="password" id="confirmPassword" required>
                    <label>Confirm Password</label>
                </div>
                <!-- <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password</a>
                </div> -->
                <button type="submit">Sign Up</button>
                <div class="register-link">
                    <p>Already have an account? <a href="/public/HtmlFiles/Login.html">Login</a></p>
                </div>
                <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
                <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
            </form>
        </div>
    </section>

    <script type="module" src="/public/JsFiles/Signin.js"></script>
</body>

</html>
